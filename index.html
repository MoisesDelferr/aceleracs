<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Acelera CS</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:;base64,iVBORw0KGgo=" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      body {
        background: #f5f6fa;
        display: flex;
        min-height: 100vh;
        color: #1a1d24;
      }
      .main-content {
        margin-left: 250px;
        width: calc(100% - 250px);
        min-height: 100vh;
        padding: 24px 32px 40px;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
        transition: all 0.3s ease;
      }
      .container { width: 100%; max-width: 1180px; margin: 0 auto; }

      /* HERO */
      .hero {
        background: linear-gradient(135deg, #f3eeff 0%, #e8e0ff 50%, #fce8f3 100%);
        border-radius: 24px;
        padding: 32px 36px;
        margin-bottom: 24px;
        position: relative;
        overflow: hidden;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
      }
      .hero::after {
        content: '✨';
        position: absolute;
        font-size: 60px;
        opacity: 0.1;
        left: 45%;
        top: 10px;
        pointer-events: none;
      }
      .hero-text h1 {
        font-size: 1.8rem;
        font-weight: 800;
        color: #1a1d24;
        letter-spacing: -0.6px;
        margin-bottom: 6px;
        position: relative;
        z-index: 1;
      }
      .hero-text .date-line {
        font-size: 0.92rem;
        color: #6b5b8a;
        font-weight: 500;
        position: relative;
        z-index: 1;
      }
      .hero-emoji {
        font-size: 4.5rem;
        line-height: 1;
        position: relative;
        z-index: 1;
        filter: drop-shadow(0 4px 8px rgba(98, 38, 239, 0.15));
      }

      /* GRID */
      .dashboard-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 20px;
      }
      @media (max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } }

      /* CARDS */
      .dash-card {
        background: #ffffff;
        border-radius: 20px;
        padding: 22px 24px;
        border: 1px solid #eef0f4;
        transition: transform 0.2s, box-shadow 0.2s;
        position: relative;
        overflow: hidden;
      }
      .dash-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.06);
      }
      .dash-card.card-purple { border-top: 4px solid #6226ef; }
      .dash-card.card-orange { border-top: 4px solid #f59e0b; }
      .dash-card.card-blue   { border-top: 4px solid #3b82f6; }
      .dash-card.card-pink   { border-top: 4px solid #ec4899; }
      .dash-card.card-green  { border-top: 4px solid #10b981; }

      .dash-card-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
      }
      .dash-card-header .icon-wrap {
        width: 36px; height: 36px;
        border-radius: 10px;
        display: flex; align-items: center; justify-content: center;
        font-size: 1.2rem; flex-shrink: 0;
      }
      .icon-wrap.purple { background: #f5f0ff; }
      .icon-wrap.orange { background: #fffbeb; }
      .icon-wrap.blue   { background: #eff6ff; }
      .icon-wrap.pink   { background: #fdf2f8; }
      .icon-wrap.green  { background: #ecfdf5; }

      .dash-card-header h2 {
        font-size: 0.98rem; font-weight: 700;
        color: #1a1d24; letter-spacing: -0.2px;
      }
      .dash-card-header .count-badge {
        margin-left: auto; background: #1a1d24; color: #fff;
        font-size: 0.7rem; font-weight: 700;
        padding: 3px 12px; border-radius: 20px;
      }

      /* LISTAS */
      .dash-list { display: flex; flex-direction: column; gap: 8px; }
      .dash-list-item {
        display: flex; align-items: center; gap: 10px;
        padding: 11px 14px; background: #fafbfd;
        border-radius: 12px; font-size: 0.86rem;
        color: #1a1d24; border-left: 4px solid #eef0f4;
        transition: background 0.15s;
      }
      .dash-list-item:hover { background: #f5f6fa; }
      .dash-list-item.urgent    { border-left-color: #dc2626; background: #fef2f2; }
      .dash-list-item.warning   { border-left-color: #f59e0b; background: #fffbeb; }
      .dash-list-item.attention { border-left-color: #ea580c; background: #fff7ed; }
      .dash-list-item .item-title { font-weight: 600; flex: 1; line-height: 1.3; }
      .dash-list-item .item-meta {
        font-size: 0.7rem; color: #8e94a8;
        white-space: nowrap; font-weight: 500;
      }
      .dash-empty {
        text-align: center; padding: 28px 12px;
        color: #a2a8bb; font-size: 0.84rem; line-height: 1.5;
      }

      /* CLIMA */
      .weather-card { display: flex; align-items: flex-start; gap: 18px; }
      .weather-icon { font-size: 3rem; line-height: 1; flex-shrink: 0; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.08)); }
      .weather-info { flex: 1; }
      .weather-info .temp { font-size: 1.7rem; font-weight: 800; color: #1a1d24; letter-spacing: -0.5px; }
      .weather-info .desc { font-size: 0.86rem; color: #5a6072; margin-top: 2px; font-weight: 500; }
      .weather-info .location { font-size: 0.74rem; color: #8e94a8; margin-top: 4px; }
      .weather-forecast {
        margin-top: 12px; padding-top: 12px;
        border-top: 1px dashed #e4e6f1;
        font-size: 0.83rem; color: #3d4351;
        display: flex; flex-direction: column; gap: 8px;
      }
      .weather-forecast div {
        display: flex; align-items: center; gap: 8px;
        background: #fafbfd; padding: 8px 12px; border-radius: 10px;
      }

      /* FRASE */
      .quote-card { background: linear-gradient(145deg, #faf5ff, #f3e8ff); border-color: #e9d5ff; }
      .quote-card .quote-text {
        font-size: 1rem; font-style: italic;
        color: #1a1d24; line-height: 1.7;
        margin-bottom: 10px; font-weight: 500;
      }
      .quote-card .quote-author { font-size: 0.82rem; color: #7c3aed; font-weight: 700; }

      /* ===================================================== */
      /* NOTÍCIAS — NOVO VISUAL                                */
      /* ===================================================== */
      .news-card {
        grid-column: 1 / -1;
        border-top: 4px solid #0ea5e9;
      }

      .news-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 16px;
      }

      .news-tile {
        display: flex;
        flex-direction: column;
        background: #ffffff;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid #eef0f4;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        position: relative;
      }

      .news-tile:hover {
        transform: translateY(-4px);
        border-color: #bae6fd;
        box-shadow: 0 16px 32px rgba(14, 165, 233, 0.12);
      }

      .news-tile:hover .news-tile-image img {
        transform: scale(1.06);
      }

      .news-tile-image {
        width: 100%;
        height: 130px;
        overflow: hidden;
        background: linear-gradient(135deg, #e0f2fe, #bae6fd);
        position: relative;
        flex-shrink: 0;
      }

      .news-tile-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.4s ease;
      }

      .news-tile-image .image-fallback {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.2rem;
        color: #0284c7;
        opacity: 0.5;
      }

      .news-tile-tag {
        position: absolute;
        top: 10px;
        left: 10px;
        font-size: 0.62rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        padding: 4px 10px;
        border-radius: 8px;
        backdrop-filter: blur(6px);
        background: rgba(255, 255, 255, 0.9);
      }
      .news-tile-tag.tag-brasil { color: #166534; }
      .news-tile-tag.tag-mundo  { color: #1e40af; }

      .news-tile-body {
        padding: 14px 16px 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 1;
      }

      .news-tile-title {
        font-size: 0.86rem;
        font-weight: 700;
        line-height: 1.35;
        color: #1a1d24;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .news-tile-footer {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.7rem;
        color: #8e94a8;
        margin-top: auto;
        padding-top: 6px;
      }

      .news-tile-footer svg {
        width: 12px;
        height: 12px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        flex-shrink: 0;
      }

      .news-tile-footer .dot {
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #cbd5e1;
      }

      /* MODAL NOTÍCIA */
      .news-modal-overlay {
        position: fixed; inset: 0;
        background: rgba(15, 18, 28, 0.5);
        backdrop-filter: blur(6px);
        display: flex; align-items: center; justify-content: center;
        z-index: 2000; opacity: 0; pointer-events: none;
        transition: opacity 0.25s; padding: 20px;
      }
      .news-modal-overlay.active { opacity: 1; pointer-events: all; }
      .news-modal {
        background: #fff; border-radius: 20px;
        max-width: 560px; width: 100%; max-height: 80vh;
        overflow-y: auto; padding: 28px 30px;
        box-shadow: 0 24px 48px rgba(0,0,0,0.15);
        transform: translateY(12px) scale(0.97);
        transition: transform 0.25s;
      }
      .news-modal-overlay.active .news-modal { transform: translateY(0) scale(1); }
      .news-modal h3 { font-size: 1.15rem; font-weight: 700; color: #1a1d24; margin-bottom: 12px; line-height: 1.4; }
      .news-modal .modal-source { font-size: 0.78rem; color: #8e94a8; margin-bottom: 16px; font-weight: 500; }
      .news-modal .modal-summary {
        font-size: 0.9rem; color: #3d4351; line-height: 1.7;
        margin-bottom: 20px; padding: 16px; background: #f8f9fc;
        border-radius: 12px; border-left: 4px solid #6226ef;
      }
      .news-modal .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
      .btn-modal-news {
        padding: 10px 22px; border-radius: 10px;
        font-size: 0.85rem; font-weight: 600;
        cursor: pointer; border: none; transition: all 0.2s;
      }
      .btn-news-close { background: #f1f2f7; color: #5a6072; }
      .btn-news-close:hover { background: #e4e6f1; }
      .btn-news-open { background: #6226ef; color: #fff; }
      .btn-news-open:hover { background: #501fc7; }

      .loading-text { text-align: center; color: #a2a8bb; font-size: 0.84rem; padding: 20px; }

      @media (max-width: 768px) {
        .main-content { margin-left: 0; width: 100%; padding: 16px; }
        .hero { padding: 24px; border-radius: 18px; }
        .hero-text h1 { font-size: 1.4rem; }
        .hero-emoji { font-size: 3rem; }
        .weather-card { flex-direction: column; gap: 10px; }
        .news-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div id="sidebar-container"></div>

    <main class="main-content" id="mainContent">
      <div class="container">
        <div class="hero">
          <div class="hero-text">
            <h1 id="greetingText">Bom dia, Moisa! ☀️</h1>
            <p class="date-line" id="dateLine">Hoje é quarta-feira (04/11/2026)</p>
          </div>
          <div class="hero-emoji" id="heroEmoji">☀️</div>
        </div>

        <div class="dashboard-grid">
          <div class="dash-card card-purple">
            <div class="dash-card-header">
              <div class="icon-wrap purple">📋</div>
              <h2>Lembretes de Hoje</h2>
              <span class="count-badge" id="remindersCount">0</span>
            </div>
            <div class="dash-list" id="remindersList">
              <div class="loading-text">Carregando...</div>
            </div>
          </div>

          <div class="dash-card card-orange">
            <div class="dash-card-header">
              <div class="icon-wrap orange">⚠️</div>
              <h2>Solicitações com Atenção</h2>
              <span class="count-badge" id="solicitacoesCount">0</span>
            </div>
            <div class="dash-list" id="solicitacoesList">
              <div class="loading-text">Carregando...</div>
            </div>
          </div>

          <div class="dash-card card-blue">
            <div class="dash-card-header">
              <div class="icon-wrap blue">🌤️</div>
              <h2>Previsão do Tempo</h2>
            </div>
            <div class="weather-card" id="weatherContent">
              <div class="loading-text">Carregando previsão...</div>
            </div>
          </div>

          <div class="dash-card quote-card">
            <div class="dash-card-header">
              <div class="icon-wrap pink">💬</div>
              <h2>Frase do Dia</h2>
            </div>
            <div id="quoteContent">
              <div class="loading-text">Carregando frase...</div>
            </div>
          </div>

          <div class="dash-card news-card">
            <div class="dash-card-header">
              <div class="icon-wrap green">📰</div>
              <h2>Notícias do Dia</h2>
            </div>
            <div class="news-grid" id="newsList">
              <div class="loading-text">Carregando notícias...</div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div class="news-modal-overlay" id="newsModal">
      <div class="news-modal">
        <h3 id="newsModalTitle">Título</h3>
        <div class="modal-source" id="newsModalSource">Fonte</div>
        <div class="modal-summary" id="newsModalSummary">Resumo...</div>
        <div class="modal-actions">
          <button class="btn-modal-news btn-news-close" onclick="fecharModalNoticia()">Fechar</button>
          <button class="btn-modal-news btn-news-open" id="newsModalOpenBtn">Ler notícia completa</button>
        </div>
      </div>
    </div>

    <script src="sidebar.js"></script>
    <script>
      // ============================================================
      // CONFIGURAÇÃO
      // ============================================================
      const VINHEDO_LAT = -23.03;
      const VINHEDO_LON = -46.98;

      const FEEDS = [
        { url: 'https://feeds.bbci.co.uk/portuguese/rss.xml', tag: 'Brasil' },
        { url: 'https://g1.globo.com/rss/g1/', tag: 'Brasil' },
        { url: 'https://feeds.bbci.co.uk/news/world/rss.xml', tag: 'Mundo' },
        { url: 'https://feeds.bbci.co.uk/news/rss.xml', tag: 'Mundo' },
      ];

      const RSS2JSON = 'https://api.rss2json.com/v1/api.json?rss_url=';

      let supabaseClient = null;
      let noticiasCache = [];

      // ============================================================
      // INICIALIZAÇÃO
      // ============================================================
      document.addEventListener('DOMContentLoaded', async function () {
        try {
          if (typeof _supabase !== 'undefined') {
            supabaseClient = _supabase;
          } else if (
            typeof supabase !== 'undefined' &&
            typeof supabase.createClient === 'function'
          ) {
            const SUPABASE_URL = 'https://pgsjhesbgqcqilkxfzed.supabase.co';
            const SUPABASE_ANON_KEY =
              'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBnc2poZXNiZ3FjcWlsa3hmemVkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNjkwMjQsImV4cCI6MjEwMDc0NTAyNH0.YmZ41BDMU_cafyTOInh-R4aSotvXnnWXCuPqorsfxqg';
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          }

          const { data: { session } } = await supabaseClient.auth.getSession();
          if (!session) {
            window.location.href = 'login.html';
            return;
          }

          renderizarSaudacao();
          carregarLembretesDoDia();
          carregarSolicitacoesAtencao();
          carregarClima();
          carregarFraseMotivacional();
          carregarNoticias();
        } catch (err) {
          console.error('Erro na inicialização:', err);
        }
      });

      // ============================================================
      // SAUDAÇÃO
      // ============================================================
      function renderizarSaudacao() {
        const agora = new Date();
        const hora = agora.getHours();
        let saudacao = 'Bom dia';
        let emoji = '☀️';
        if (hora >= 12 && hora < 18) { saudacao = 'Boa tarde'; emoji = '🌤️'; }
        else if (hora >= 18) { saudacao = 'Boa noite'; emoji = '🌙'; }

        document.getElementById('greetingText').textContent = `${saudacao}, Moisa! ${emoji}`;
        document.getElementById('heroEmoji').textContent = emoji;

        const diasSemana = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
        const dia = String(agora.getDate()).padStart(2, '0');
        const mes = String(agora.getMonth() + 1).padStart(2, '0');
        const ano = agora.getFullYear();
        document.getElementById('dateLine').textContent = `Hoje é ${diasSemana[agora.getDay()]} (${dia}/${mes}/${ano})`;
      }

      // ============================================================
      // LEMBRETES
      // ============================================================
      async function carregarLembretesDoDia() {
        const container = document.getElementById('remindersList');
        const countBadge = document.getElementById('remindersCount');
        try {
          const { data: { user } } = await supabaseClient.auth.getUser();
          if (!user) return;
          const hojeStr = new Date().toISOString().split('T')[0];
          const { data, error } = await supabaseClient
            .from('reminders').select('*').eq('user_id', user.id)
            .eq('data', hojeStr).eq('concluido', false)
            .order('urgente', { ascending: false });
          if (error) throw error;
          const lembretes = data || [];
          countBadge.textContent = lembretes.length;
          if (lembretes.length === 0) {
            container.innerHTML = '<div class="dash-empty">Nenhum lembrete para hoje. 🎉</div>';
            return;
          }
          container.innerHTML = lembretes.map(item => `
            <div class="dash-list-item ${item.urgente ? 'urgent' : ''}">
              <span class="item-title">${escapeHtml(item.titulo)}</span>
              ${item.urgente ? '<span class="item-meta">⚡ Urgente</span>' : ''}
            </div>
          `).join('');
        } catch (err) {
          console.error(err);
          container.innerHTML = '<div class="dash-empty">Erro ao carregar lembretes.</div>';
        }
      }

      // ============================================================
      // SOLICITAÇÕES
      // ============================================================
      async function carregarSolicitacoesAtencao() {
        const container = document.getElementById('solicitacoesList');
        const countBadge = document.getElementById('solicitacoesCount');
        try {
          const { data: { user } } = await supabaseClient.auth.getUser();
          if (!user) return;
          const { data, error } = await supabaseClient
            .from('solicitacoes').select('*').eq('user_id', user.id)
            .neq('status', 'Concluída');
          if (error) throw error;
          const todas = data || [];
          const hojeStr = new Date().toISOString().split('T')[0];
          const atencao = todas.filter(s => {
            if (s.tipo_solicitacao === 'Cancelamento' && s.data_efetivacao && String(s.data_efetivacao).slice(0,10) === hojeStr) return true;
            if (s.status === 'Sem Retorno 1° Dia' || s.status === 'Sem Retorno 2° Dia' || s.status === 'Atenção') return true;
            return false;
          });
          countBadge.textContent = atencao.length;
          if (atencao.length === 0) {
            container.innerHTML = '<div class="dash-empty">Nenhuma solicitação crítica. 👍</div>';
            return;
          }
          const ordem = { 'Atenção': 0, 'Sem Retorno 2° Dia': 1, 'Sem Retorno 1° Dia': 2 };
          atencao.sort((a,b) => (ordem[a.status] ?? 9) - (ordem[b.status] ?? 9));
          container.innerHTML = atencao.map(item => {
            let classe = 'warning', meta = item.status;
            if (item.status === 'Atenção') { classe = 'urgent'; meta = '3° dia sem retorno'; }
            else if (item.status === 'Sem Retorno 2° Dia') { classe = 'attention'; meta = '2° dia sem retorno'; }
            else if (item.status === 'Sem Retorno 1° Dia') { classe = 'warning'; meta = '1° dia sem retorno'; }
            else if (item.tipo_solicitacao === 'Cancelamento' && item.data_efetivacao) { meta = 'Efetiva hoje'; classe = 'urgent'; }
            return `<div class="dash-list-item ${classe}">
              <span class="item-title">${escapeHtml(item.nome_cliente)} <span style="color:#8e94a8;font-weight:400;font-size:0.78rem">(${escapeHtml(item.protocolo)})</span></span>
              <span class="item-meta">${meta}</span>
            </div>`;
          }).join('');
        } catch (err) {
          console.error(err);
          container.innerHTML = '<div class="dash-empty">Erro ao carregar solicitações.</div>';
        }
      }

      // ============================================================
      // CLIMA
      // ============================================================
      async function carregarClima() {
        const container = document.getElementById('weatherContent');
        try {
          const url = `https://api.open-meteo.com/v1/forecast?latitude=${VINHEDO_LAT}&longitude=${VINHEDO_LON}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=America/Sao_Paulo&forecast_days=1`;
          const response = await fetch(url);
          if (!response.ok) throw new Error('Falha na API de clima');
          const data = await response.json();
          const current = data.current, daily = data.daily, hourly = data.hourly;
          const temp = Math.round(current.temperature_2m);
          const tempMax = Math.round(daily.temperature_2m_max[0]);
          const tempMin = Math.round(daily.temperature_2m_min[0]);
          const umidade = current.relative_humidity_2m;
          const vento = Math.round(current.wind_speed_10m);
          const weatherInfo = obterIconeClima(current.weather_code);
          const idx12 = hourly.time.findIndex(t => t.includes('T12:00'));
          const idx18 = hourly.time.findIndex(t => t.includes('T18:00'));
          const almocoTemp = idx12 >= 0 ? Math.round(hourly.temperature_2m[idx12]) : null;
          const almocoIcon = idx12 >= 0 ? obterIconeClima(hourly.weather_code[idx12]) : null;
          const saidaTemp = idx18 >= 0 ? Math.round(hourly.temperature_2m[idx18]) : null;
          const saidaIcon = idx18 >= 0 ? obterIconeClima(hourly.weather_code[idx18]) : null;
          container.innerHTML = `
            <div class="weather-icon">${weatherInfo.icone}</div>
            <div class="weather-info">
              <div class="temp">${temp}°C</div>
              <div class="desc">${weatherInfo.descricao} · Máx ${tempMax}° / Mín ${tempMin}°</div>
              <div class="location">Vinhedo - SP · Umidade ${umidade}% · Vento ${vento} km/h</div>
              <div class="weather-forecast">
                <div>🍽️ <strong>Almoço (12h–14h):</strong> ${almocoIcon ? almocoIcon.icone : ''} ${almocoTemp !== null ? almocoTemp + '°C' : '—'} ${almocoIcon ? '· ' + almocoIcon.descricao : ''}</div>
                <div>🏠 <strong>Saída (18h):</strong> ${saidaIcon ? saidaIcon.icone : ''} ${saidaTemp !== null ? saidaTemp + '°C' : '—'} ${saidaIcon ? '· ' + saidaIcon.descricao : ''}</div>
              </div>
            </div>`;
        } catch (err) {
          console.error(err);
          container.innerHTML = '<div class="dash-empty">Não foi possível carregar a previsão.</div>';
        }
      }

      function obterIconeClima(codigo) {
        const mapa = {
          0:{icone:'☀️',descricao:'Céu limpo'}, 1:{icone:'🌤️',descricao:'Principalmente limpo'},
          2:{icone:'⛅',descricao:'Parcialmente nublado'}, 3:{icone:'☁️',descricao:'Nublado'},
          45:{icone:'🌫️',descricao:'Nevoeiro'}, 48:{icone:'🌫️',descricao:'Nevoeiro com geada'},
          51:{icone:'🌦️',descricao:'Chuvisco leve'}, 53:{icone:'🌦️',descricao:'Chuvisco moderado'},
          55:{icone:'🌧️',descricao:'Chuvisco denso'}, 61:{icone:'🌧️',descricao:'Chuva leve'},
          63:{icone:'🌧️',descricao:'Chuva moderada'}, 65:{icone:'🌧️',descricao:'Chuva forte'},
          71:{icone:'🌨️',descricao:'Neve leve'}, 73:{icone:'🌨️',descricao:'Neve moderada'},
          75:{icone:'🌨️',descricao:'Neve forte'}, 80:{icone:'🌦️',descricao:'Pancadas leves'},
          81:{icone:'🌧️',descricao:'Pancadas moderadas'}, 82:{icone:'⛈️',descricao:'Pancadas violentas'},
          95:{icone:'⛈️',descricao:'Trovoada'}, 96:{icone:'⛈️',descricao:'Trovoada com granizo'},
          99:{icone:'⛈️',descricao:'Trovoada forte com granizo'},
        };
        return mapa[codigo] || {icone:'🌡️',descricao:'Condição desconhecida'};
      }

      // ============================================================
      // FRASE
      // ============================================================
      async function carregarFraseMotivacional() {
        const container = document.getElementById('quoteContent');
        const frasesLocais = [
          { texto: 'O sucesso é a soma de pequenos esforços repetidos dia após dia.', autor: 'Robert Collier' },
          { texto: 'Acredite que você pode e você já está no meio do caminho.', autor: 'Theodore Roosevelt' },
          { texto: 'A melhor maneira de prever o futuro é criá-lo.', autor: 'Peter Drucker' },
          { texto: 'Não é sobre ter todas as respostas, é sobre estar disposto a encontrá-las.', autor: 'Anônimo' },
        ];

        const f = frasesLocais[Math.floor(Math.random() * frasesLocais.length)];
        container.innerHTML = `<p class="quote-text">"${f.texto}"</p><p class="quote-author">— ${f.autor}</p>`;

        try {
          const res = await fetch('https://quoteslate.vercel.app/api/quotes/random?tags=motivation&maxLength=160');
          if (!res.ok) return;
          const data = await res.json();
          if (data && typeof data.text === 'string' && data.text.trim() !== '') {
            container.innerHTML = `<p class="quote-text">"${escapeHtml(data.text)}"</p><p class="quote-author">— ${escapeHtml(data.author || 'Anônimo')}</p>`;
          }
        } catch {
          // fallback já renderizado
        }
      }

      // ============================================================
      // NOTÍCIAS (RSS via rss2json)
      // ============================================================
      async function carregarNoticias() {
        const container = document.getElementById('newsList');

        try {
          const promessas = FEEDS.map(feed =>
            fetch(RSS2JSON + encodeURIComponent(feed.url), { signal: AbortSignal.timeout(10000) })
              .then(r => r.ok ? r.json() : null)
              .catch(() => null)
          );

          const resultados = await Promise.allSettled(promessas);
          let artigos = [];

          resultados.forEach((r, i) => {
            if (r.status !== 'fulfilled' || !r.value || r.value.status !== 'ok') return;
            const tag = FEEDS[i].tag;
            const items = r.value.items || [];
            items.slice(0, 4).forEach(item => {
              const titulo = (item.title || '').trim();
              const link = item.link || '';
              if (!titulo || !link) return;
              artigos.push({
                titulo,
                link,
                resumo: limparHtml(item.description || '').substring(0, 280),
                imagem: extrairImagem(item),
                fonte: tag,
                data: item.pubDate || '',
              });
            });
          });

          const vistos = new Set();
          artigos = artigos.filter(a => {
            if (vistos.has(a.link)) return false;
            vistos.add(a.link);
            return true;
          });
          artigos.sort((a, b) => new Date(b.data) - new Date(a.data));
          const exibir = artigos.slice(0, 8);

          if (exibir.length === 0) {
            container.innerHTML = '<div class="dash-empty">Não foi possível carregar as notícias agora. Tente novamente mais tarde.</div>';
            return;
          }

          noticiasCache = exibir;

          container.innerHTML = exibir.map((n, idx) => {
            const isBrasil = n.fonte === 'Brasil';
            const imagemHtml = n.imagem
              ? `<img src="${escapeHtml(n.imagem)}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'image-fallback\\'>📰</div>'" />`
              : `<div class="image-fallback">📰</div>`;
            return `
              <div class="news-tile" onclick="abrirModalNoticia(${idx})">
                <div class="news-tile-image">
                  ${imagemHtml}
                  <span class="news-tile-tag ${isBrasil ? 'tag-brasil' : 'tag-mundo'}">${n.fonte}</span>
                </div>
                <div class="news-tile-body">
                  <div class="news-tile-title">${escapeHtml(n.titulo)}</div>
                  <div class="news-tile-footer">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    ${formatarDataNoticia(n.data) || 'Hoje'}
                  </div>
                </div>
              </div>`;
          }).join('');
        } catch (err) {
          console.error('Erro ao carregar notícias:', err);
          container.innerHTML = '<div class="dash-empty">Não foi possível carregar as notícias agora. Tente novamente mais tarde.</div>';
        }
      }

      // Extrai imagem do item RSS (thumbnail, enclosure ou content)
      function extrairImagem(item) {
        if (item.thumbnail) return item.thumbnail;
        if (item.enclosure && item.enclosure.link) return item.enclosure.link;
        if (item.content) {
          const match = item.content.match(/<img[^>]+src=["']([^"']+)["']/i);
          if (match) return match[1];
        }
        if (item.description) {
          const match = item.description.match(/<img[^>]+src=["']([^"']+)["']/i);
          if (match) return match[1];
        }
        return null;
      }

      function limparHtml(texto) {
        if (!texto) return '';
        const div = document.createElement('div');
        div.innerHTML = texto;
        let t = div.textContent || div.innerText || '';
        return t.replace(/\s+/g, ' ').trim();
      }

      // ============================================================
      // MODAL
      // ============================================================
      function abrirModalNoticia(index) {
        const n = noticiasCache[index];
        if (!n) return;
        document.getElementById('newsModalTitle').textContent = n.titulo;
        document.getElementById('newsModalSource').textContent = `Fonte: ${n.fonte}`;
        document.getElementById('newsModalSummary').textContent = n.resumo || 'Resumo não disponível para esta notícia.';
        const btn = document.getElementById('newsModalOpenBtn');
        btn.onclick = () => window.open(n.link, '_blank', 'noopener');
        document.getElementById('newsModal').classList.add('active');
      }

      function fecharModalNoticia() {
        document.getElementById('newsModal').classList.remove('active');
      }

      document.getElementById('newsModal').addEventListener('click', function(e) {
        if (e.target === this) fecharModalNoticia();
      });

      // ============================================================
      // UTILITÁRIOS
      // ============================================================
      function formatarDataNoticia(dataStr) {
        if (!dataStr) return '';
        try {
          const d = new Date(dataStr);
          if (isNaN(d.getTime())) return '';
          const dia = String(d.getDate()).padStart(2, '0');
          const mes = String(d.getMonth() + 1).padStart(2, '0');
          const hora = String(d.getHours()).padStart(2, '0');
          const min = String(d.getMinutes()).padStart(2, '0');
          return `${dia}/${mes} ${hora}:${min}`;
        } catch { return ''; }
      }

      function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }
    </script>
  </body>
